[package]
name = "pywinio"
version = "0.1.0"
edition = "2024"

[lib]
name = "_pywinio"
crate-type = ["cdylib", "rlib"]

[features]
# Off by default in tests (`cargo test --no-default-features`) so the test
# binary links libpython instead of being built as an extension module.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["experimental-inspect"] }
futures-util = "0.3"
winio = { version = "0.13.0-beta.3", default-features = false, features = [
    "winui",
    "win32-dark-mode",
    # The CBS 1.6 variant of winui3 was meant for windows system apps
    # We don't assume users have installed winui3 through any apps
    "winui-enable-cbs",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
winio-winui3 = "0.7.0-alpha.8"
